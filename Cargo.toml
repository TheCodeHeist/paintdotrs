[package]
name = "pixel_easel"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
epaint_default_fonts = "0.37"
flate2 = "1.1.11"
image = "0.25.10"
rayon = "1.12.0"

# Pixel work must be fast in every build, including quick test builds.
[profile.dev]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 4
